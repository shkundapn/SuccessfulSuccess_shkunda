AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Event-driven weekly meetings report: EventBridge Scheduler & SQS queue,
  report-builder Lambda in VPC with S3 Gateway Endpoint, and report-mailer Lambda
  outside VPC triggered by S3 ObjectCreated sending via Amazon SES.

Parameters:
  ProjectName:
    Type: String
    Default: spry-shkunda
    Description: Prefix for resources in this stack.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where Aurora / RDS and the builder Lambda reside.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for the VPC Lambda function.

  RouteTableIds:
    Type: List<String>
    Description: Route table IDs to attach the S3 Gateway VPC Endpoint to.

  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security groups for the builder Lambda.

  ImageUri:
    Type: String
    Description: ECR container image URI for the backend (reused by builder).

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Connection string for PostgreSQL database.

  RecipientEmail:
    Type: String
    Default: maksym.shkunda.25@cnu.edu.ua
    Description: Verified recipient email for Amazon SES.

  SenderEmail:
    Type: String
    Default: maksym.shkunda.25@cnu.edu.ua
    Description: Verified sender email for Amazon SES.

  AppTimezone:
    Type: String
    Default: Europe/Kyiv

Resources:
  # --- S3 Gateway Endpoint (Free VPC Endpoint for S3) -------------------------
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-s3-endpoint"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- SQS Queues -------------------------------------------------------------
  ReportDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      VisibilityTimeout: 360 # 6 times the builder's 60s timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- EventBridge Scheduler --------------------------------------------------
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendMessageToQueue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report"
      Description: Weekly meetings report trigger (Every Monday at 07:00 Kyiv time)
      ScheduleExpression: "cron(0 7 ? * MON *)"
      ScheduleExpressionTimezone: !Ref AppTimezone
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

  # --- Report Builder Lambda (in VPC, reuses backend image) -------------------
  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: BuilderPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReportQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-builder"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      Description: Queries meetings DB inside VPC and writes weekly CSV to S3
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - app.reports.lambda_handler.builder_handler
      Role: !GetAtt BuilderRole.Arn
      Timeout: 60
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref BuilderLogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          REPORTS_BUCKET: !Sub "${ProjectName}-reports-${AWS::AccountId}"
          APP_TIMEZONE: !Ref AppTimezone
          LOG_LEVEL: INFO
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  QueueEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportQueue.Arn
      FunctionName: !GetAtt BuilderFunction.Arn
      BatchSize: 1
      Enabled: true

  # --- Report Mailer Lambda (outside VPC, triggered by S3) --------------------
  MailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MailerPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-mailer"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Description: Triggered by S3 ObjectCreated to email CSV reports via SES
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MailerRole.Arn
      Timeout: 30
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Ref MailerLogGroup
      Environment:
        Variables:
          RECIPIENT_EMAIL: !Ref RecipientEmail
          SENDER_EMAIL: !Ref SenderEmail
      Code:
        ZipFile: |
          import json, os, urllib.parse, boto3, logging
          from email.message import EmailMessage

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              records = event.get("Records", [])
              if not records:
                  return {"statusCode": 400, "body": "No records"}
              s3_info = records[0].get("s3", {})
              bucket = s3_info.get("bucket", {}).get("name")
              key = urllib.parse.unquote_plus(s3_info.get("object", {}).get("key", ""))

              # Required CloudWatch log line for lab submission
              logger.info(f"report-mailer triggered: trigger=s3 key={key}")

              filename = key.split("/")[-1]
              week = filename.replace(".csv", "")

              s3 = boto3.client("s3")
              obj = s3.get_object(Bucket=bucket, Key=key)
              csv_content = obj["Body"].read()

              sender = os.environ.get("SENDER_EMAIL", "maksym.shkunda.25@cnu.edu.ua")
              recipient = os.environ.get("RECIPIENT_EMAIL", "maksym.shkunda.25@cnu.edu.ua")

              msg = EmailMessage()
              msg["Subject"] = f"Weekly Meetings Report — {week}"
              msg["From"] = sender
              msg["To"] = recipient
              msg.set_content(
                  f"Hello,\n\n"
                  f"Your weekly meetings report for {week} has been successfully generated.\n\n"
                  f"Report file: {filename}\n"
                  f"S3 location: s3://{bucket}/{key}\n\n"
                  f"Attached is the full CSV breakdown.\n\n"
                  f"Best regards,\nSpry Meetings Pipeline"
              )
              msg.add_attachment(csv_content, maintype="text", subtype="csv", filename=filename)

              ses = boto3.client("ses", region_name=os.environ.get("AWS_REGION", "us-east-1"))
              resp = ses.send_raw_email(
                  Source=sender,
                  Destinations=[recipient],
                  RawMessage={"Data": msg.as_bytes()}
              )
              logger.info(f"Email sent successfully to {recipient}, MessageId={resp.get('MessageId')}")
              return {"statusCode": 200, "messageId": resp.get("MessageId")}
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MailerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}"
      SourceAccount: !Ref "AWS::AccountId"

  # --- S3 Reports Bucket (Explicit Name & 90-day lifecycle) -------------------
  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: MailerPermission
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteReportsAfter90Days
            Status: Enabled
            ExpirationInDays: 90
            Prefix: reports/
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt MailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  ReportsBucketName:
    Description: S3 bucket where reports are stored
    Value: !Ref ReportsBucket

  ReportQueueUrl:
    Description: SQS Queue URL for report requests
    Value: !Ref ReportQueue

  ReportQueueArn:
    Description: SQS Queue ARN
    Value: !GetAtt ReportQueue.Arn

  ReportDlqUrl:
    Description: SQS Dead-Letter Queue URL
    Value: !Ref ReportDlq

  BuilderFunctionName:
    Description: Report Builder Lambda Function Name
    Value: !Ref BuilderFunction

  MailerFunctionName:
    Description: Report Mailer Lambda Function Name
    Value: !Ref MailerFunction

  ScheduleName:
    Description: EventBridge Scheduler Name
    Value: !Ref WeeklySchedule
