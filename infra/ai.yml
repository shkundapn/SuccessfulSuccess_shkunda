# ==============================================================================
# DEPRECATED: Migrated to Terraform (infra/ai.tf) in Lab 7.
# Retain policies ensure existing Agenda Parser Lambda function and Function URL are preserved.
# ==============================================================================
AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Spry — Paste an agenda LLM parser service on Amazon Bedrock.
  Runs outside the VPC with no NAT or PrivateLink endpoints ($0 idle cost).

Parameters:
  ProjectName:
    Type: String
    Default: spry-shkunda

  ImageUri:
    Type: String
    Default: ""

  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]

  MemorySize:
    Type: Number
    Default: 512

  Timeout:
    Type: Number
    Default: 30

  CognitoUserPoolId:
    Type: String
    Default: ""

  CognitoClientId:
    Type: String
    Default: ""

  CognitoJwks:
    Type: String
    Default: ""

  CorsOrigins:
    Type: String
    Default: "*"

  ParserModel:
    Type: String
    Default: amazon.nova-lite-v1:0

  AppTimezone:
    Type: String
    Default: Europe/Kyiv

Resources:
  AgendaParserRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInferencePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-mantle:CreateInference
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:Converse
                  - bedrock:ConverseStream
                  - bedrock:ListFoundationModels
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  AgendaParserFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      Description: Paste an agenda parser calling Amazon Bedrock outside VPC
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - app.ai.agenda_lambda.handler
      Architectures:
        - !Ref Architecture
      Role: !GetAtt AgendaParserRole.Arn
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          PARSER_MODEL: !Ref ParserModel
          APP_TIMEZONE: !Ref AppTimezone
          CORS_ORIGINS: !Ref CorsOrigins
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_JWKS: !Ref CognitoJwks
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  FunctionUrl:
    Type: AWS::Lambda::Url
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TargetFunctionArn: !GetAtt AgendaParserFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref AgendaParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref AgendaParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  AgendaParserUrl:
    Value: !Sub ["https://${Host}", {Host: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]}]
  FunctionName:
    Value: !Ref AgendaParserFunction
  LogGroupName:
    Value: !Ref LogGroup
